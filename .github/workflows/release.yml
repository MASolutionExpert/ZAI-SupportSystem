# =============================================================================
# Support Desk — Release pipeline
#
# Triggered by pushing a version tag (vX.Y.Z). The pipeline:
#   1. reads the VERSION file and verifies the git tag matches it,
#   2. builds the production Docker image (linux/amd64),
#   3. publishes it to ghcr.io with semantic version tags:
#        :X.Y.Z (exact)  :X.Y (compatibility line)  :X (major line)
#
# NOTE: the `latest` tag is deliberately NEVER published — production
# deployments must pin an explicit version or compatibility line. The
# registry/mirror used at DEPLOY time is configurable via SUPPORTDESK_IMAGE
# in .env (see DEPLOYMENT.md), so images can be pulled from a private mirror
# without rebuilding.
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release entry
  packages: write   # publish the container image

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & publish versioned image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Support Desk v${VERSION} (git tag: ${GITHUB_REF_NAME})"

      - name: Verify tag matches VERSION
        run: |
          if [ "v${{ steps.version.outputs.version }}" != "${{ github.ref_name }}" ]; then
            echo "::error::Git tag '${{ github.ref_name }}' does not match the VERSION file ('${{ steps.version.outputs.version }}')."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # Semantic version tags from the vX.Y.Z tag: 0.1.0 / 0.1 / 0.
          # NO :latest — version-pinned upgrades are enforced by design.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Support Desk v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --verify-tag

      - name: Job summary
        run: |
          {
            echo "### Support Desk image published"
            echo ""
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platforms: linux/amd64"
            echo "- Tags:"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Deploy with:"
            echo ""
            echo '```'
            echo "SUPPORTDESK_IMAGE=${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.version }}"
            echo '```'
            echo ""
            echo "(:latest is intentionally never published; registry/mirror is configurable via SUPPORTDESK_IMAGE.)"
          } >> "$GITHUB_STEP_SUMMARY"
