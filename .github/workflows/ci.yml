# =============================================================================
# ZAI Support System — CI
#
# Fast, honest checks on every push/PR to main:
#   lint       eslint over the repository
#   typecheck  tsc --noEmit
#   build      next build (standalone artifact) with dummy configuration
#   tests      the four mandated verification suites (phases 4-7) executed
#              against a live dev server on a fresh migrated database:
#                phase 4  concurrent ticket creation & fair-distribution
#                phase 5  file-hub fail-closed security
#                phase 6  super-admin permission matrix & audit trail
#                phase 7  production hardening (headers, CSRF, sessions,
#                         injection, AI guardrails, throttling, lockout)
#
# No real secrets are required anywhere: dummy values satisfy the
# application's env contract and bootstrap is confined to a throwaway DB.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bun run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy values so the pipeline never needs real secrets.
      DATABASE_URL: file:../db/ci.db  # relative paths resolve against prisma/, so ../db = repo/db
      AUTH_SECRET: dummy-secret-dummy-secret-dummy-secret-1234
      SUPERADMIN_USERNAME: ci-admin
      SUPERADMIN_PASSWORD: ci-dummy-Passw0rd-123
      BOOTSTRAP_ON_STARTUP: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build (standalone artifact)
        run: bun run build

      - name: Verify standalone artifact
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          echo "Standalone artifact OK."

  tests:
    name: tests (phase 4-7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:../db/ci.db
      AUTH_SECRET: dummy-secret-dummy-secret-dummy-secret-1234
      APP_ENCRYPTION_KEY: dummy-encryption-key-dummy-encryption-key-1234=
      SUPERADMIN_USERNAME: ci-admin
      SUPERADMIN_PASSWORD: ci-dummy-Passw0rd-123
      BOOTSTRAP_ON_STARTUP: "true"
      APP_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply migrations to a fresh database
        run: bunx prisma migrate deploy

      - name: Start dev server
        run: |
          bun run dev > dev-ci.log 2>&1 &
          echo $! > dev.pid

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "Dev server is healthy (attempt ${i})."
              curl -fsS http://127.0.0.1:3000/api/health
              exit 0
            fi
            sleep 5
          done
          echo "::error::Dev server did not become healthy within 300s."
          tail -100 dev-ci.log || true
          exit 1

      - name: Seed demo baseline (departments, KB, operators)
        run: bun --conditions=react-server scripts/seed-demo.ts

      - name: Phase 4 — concurrent ticket creation & fair distribution
        run: bun --conditions=react-server scripts/test-phase4-concurrency.ts

      - name: Phase 5 — file hub fail-closed security
        run: bun --conditions=react-server scripts/test-phase5-security.ts

      - name: Phase 6 — admin permission matrix & audit trail
        run: bun --conditions=react-server scripts/test-phase6-security.ts

      - name: Phase 7 — production hardening suite
        run: bun --conditions=react-server scripts/test-phase7-hardening.ts

      - name: Dump dev server log (on failure)
        if: failure()
        run: tail -150 dev-ci.log || true
